name: Standalone package
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - run: bash scripts/check-package.sh
      - run: python3 scripts/test-image-publication.py
      - name: Build CLI without publication credentials
        run: |
          set -euo pipefail
          image="orchestrator:pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -t "$image" .
          docker run --rm --network none "$image" --help >/dev/null
